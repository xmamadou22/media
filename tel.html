<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Téléchargeur Audio & Vidéo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
            color: #e0e0e0;
        }

        .container {
            max-width: 700px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            font-size: 2em;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d9ff, #5b8cff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #urlInput {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 1em;
            outline: none;
            transition: border-color 0.3s;
        }

        #urlInput:focus {
            border-color: #00d9ff;
        }

        #fetchBtn {
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #00d9ff, #5b8cff);
            color: #0f0f1a;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            white-space: nowrap;
        }

        #fetchBtn:hover {
            transform: translateY(-2px);
        }

        #fetchBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .mode-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .mode-btn {
            padding: 10px 24px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            background: transparent;
            color: #ccc;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .mode-btn.active {
            background: rgba(0, 217, 255, 0.15);
            border-color: #00d9ff;
            color: #00d9ff;
        }

        #status {
            text-align: center;
            margin: 15px 0;
            min-height: 24px;
            color: #888;
            font-size: 0.9em;
        }

        #status.error {
            color: #ff6b6b;
        }

        #status.success {
            color: #4ade80;
        }

        #results {
            margin-top: 20px;
        }

        .result-card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-info {
            flex: 1;
        }

        .result-quality {
            font-size: 1.1em;
            font-weight: 600;
            color: #00d9ff;
        }

        .result-type {
            font-size: 0.85em;
            color: #888;
            margin-top: 4px;
        }

        .download-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #4ade80, #22c55e);
            color: #0f0f1a;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s;
            white-space: nowrap;
        }

        .download-btn:hover {
            transform: translateY(-2px);
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00d9ff;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 0.8s linear infinite;
            margin: 20px auto;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .platforms {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            color: #666;
            font-size: 0.8em;
        }

        .platforms span {
            color: #00d9ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⬇️ Téléchargeur Audio & Vidéo</h1>
        <p class="subtitle">Collez une URL et téléchargez en meilleure qualité</p>

        <div class="mode-toggle">
            <button class="mode-btn active" id="videoMode" onclick="setMode('video')">🎬 Vidéo</button>
            <button class="mode-btn" id="audioMode" onclick="setMode('audio')">🎵 Audio</button>
        </div>

        <div class="input-group">
            <input type="text" id="urlInput" placeholder="Collez votre URL ici (YouTube, TikTok, Instagram...)" onkeydown="if(event.key==='Enter') fetchData()">
            <button id="fetchBtn" onclick="fetchData()">Obtenir</button>
        </div>

        <div class="spinner" id="spinner"></div>
        <div id="status"></div>
        <div id="results"></div>

        <div class="platforms">
            Plateformes supportées : <span>YouTube, TikTok, Instagram, Twitter/X, SoundCloud, Vimeo, Facebook, Reddit, Pinterest, et plus</span>
        </div>
    </div>

    <script>
        let currentMode = 'video';

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('videoMode').classList.toggle('active', mode === 'video');
            document.getElementById('audioMode').classList.toggle('active', mode === 'audio');
            // Re-fetch si une URL est déjà entrée
            const url = document.getElementById('urlInput').value.trim();
            if (url) fetchData();
        }

        async function fetchData() {
            const url = document.getElementById('urlInput').value.trim();
            const statusEl = document.getElementById('status');
            const resultsEl = document.getElementById('results');
            const spinner = document.getElementById('spinner');
            const btn = document.getElementById('fetchBtn');

            if (!url) {
                statusEl.textContent = '⚠️ Veuillez entrer une URL';
                statusEl.className = 'error';
                return;
            }

            statusEl.textContent = '';
            statusEl.className = '';
            resultsEl.innerHTML = '';
            spinner.style.display = 'block';
            btn.disabled = true;

            try {
                const response = await fetch('https://api.cobalt.tools/api/json', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        url: url,
                        vQuality: 'max',
                        isAudioOnly: currentMode === 'audio'
                    })
                });

                const data = await response.json();
                spinner.style.display = 'none';
                btn.disabled = false;

                if (data.status === 'error' || data.status === 'rate-limit') {
                    statusEl.textContent = '❌ Erreur: ' + (data.text || 'Impossible de traiter cette URL');
                    statusEl.className = 'error';
                    return;
                }

                if (data.status === 'redirect' || data.status === 'success') {
                    statusEl.textContent = '✅ Liens de téléchargement prêts !';
                    statusEl.className = 'success';

                    // Si on a une URL unique (redirect)
                    if (data.url) {
                        addResultCard(data.url, currentMode === 'audio' ? 'Audio (meilleure qualité)' : 'Vidéo (meilleure qualité)');
                    }

                    // Si on a plusieurs formats (picker)
                    if (data.picker && data.picker.length > 0) {
                        if (data.pickerType === 'video') {
                            // Trier par qualité (du plus haut au plus bas)
                            const sorted = data.picker.sort((a, b) => {
                                const aQ = parseInt(a.quality) || 0;
                                const bQ = parseInt(b.quality) || 0;
                                return bQ - aQ;
                            });
                            sorted.forEach(item => {
                                addResultCard(item.url, `Vidéo ${item.quality}p`);
                            });
                        } else if (data.pickerType === 'photo') {
                            data.picker.forEach((item, i) => {
                                addResultCard(item.url, `Image ${i + 1}`);
                            });
                        } else {
                            data.picker.forEach(item => {
                                addResultCard(item.url, 'Fichier');
                            });
                        }
                    }

                    // S'il y a un nom de fichier
                    if (data.filename) {
                        statusEl.textContent = '✅ Fichier: ' + data.filename;
                    }
                } else {
                    statusEl.textContent = '❌ Réponse inattendue du serveur';
                    statusEl.className = 'error';
                }
            } catch (error) {
                spinner.style.display = 'none';
                btn.disabled = false;
                statusEl.textContent = '❌ Erreur réseau: ' + error.message;
                statusEl.className = 'error';
            }
        }

        function addResultCard(url, label) {
            const resultsEl = document.getElementById('results');
            const card = document.createElement('div');
            card.className = 'result-card';

            const isAudio = currentMode === 'audio';
            const icon = isAudio ? '🎵' : '🎬';

            card.innerHTML = `
                <div class="result-info">
                    <div class="result-quality">${icon} ${label}</div>
                    <div class="result-type">Cliquez pour télécharger</div>
                </div>
                <a href="${url}" download target="_blank" class="download-btn">⬇️ Télécharger</a>
            `;
            resultsEl.appendChild(card);
        }
    </script>
</body>
</html>
